
name: Deploy Service

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Select target cluster"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

      namespace:
        description: "Kubernetes namespace"
        required: true
        type: string

      service-version:
        description: "Service version / image tag"
        required: true
        type: string

permissions:
  contents: read
  security-events: write

env:
  SERVICE_NAME: my-service

jobs:

  # ==========================================================
  # 1. Security Scan
  # ==========================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run security scan
        run: |
          echo "Running security scan..."

          # TODO:
          # Replace this with your actual security scanner.
          #
          # Example:
          # trivy fs --severity HIGH,CRITICAL --exit-code 1 .

          echo "Security scan completed successfully."


  # ==========================================================
  # 2. Display Deployment Information
  # ==========================================================
  display-info:
    name: Display Deployment Info
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Display information
        run: |
          echo "=========================================="
          echo "        DEPLOYMENT INFORMATION"
          echo "=========================================="
          echo "Service          : ${{ env.SERVICE_NAME }}"
          echo "Cluster          : ${{ inputs.cluster }}"
          echo "Namespace        : ${{ inputs.namespace }}"
          echo "Service Version  : ${{ inputs.service-version }}"
          echo "Commit SHA       : ${{ github.sha }}"
          echo "Triggered by     : ${{ github.actor }}"
          echo "=========================================="


  # ==========================================================
  # 3. Deploy
  # ==========================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: display-info

    environment:
      name: ${{ inputs.cluster }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # ------------------------------------------------------
      # Configure Kubernetes credentials
      # ------------------------------------------------------
      - name: Configure Kubernetes
        run: |
          echo "Configuring Kubernetes access..."

          # Recommended:
          # Store kubeconfig / credentials in GitHub Secrets
          # and configure them here.
          #
          # Example:
          # mkdir -p ~/.kube
          # echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          #
          # For multiple clusters, you can use:
          # secrets.KUBECONFIG_DEV
          # secrets.KUBECONFIG_STAGING
          # secrets.KUBECONFIG_PRODUCTION

      # ------------------------------------------------------
      # Deploy service
      # ------------------------------------------------------
      - name: Deploy service
        run: |
          echo "=========================================="
          echo "Starting deployment..."
          echo "Cluster   : ${{ inputs.cluster }}"
          echo "Namespace : ${{ inputs.namespace }}"
          echo "Version   : ${{ inputs.service-version }}"
          echo "=========================================="

          # Example Kubernetes deployment:
          #
          # kubectl -n "${{ inputs.namespace }}" \
          #   set image deployment/${{ env.SERVICE_NAME }} \
          #   ${{ env.SERVICE_NAME }}:${{ inputs.service-version }}

          echo "Deployment command executed."

      # ------------------------------------------------------
      # Wait for rollout
      # ------------------------------------------------------
      - name: Verify deployment
        run: |
          echo "Verifying deployment..."

          # Example:
          #
          # kubectl rollout status \
          #   deployment/${{ env.SERVICE_NAME }} \
          #   -n "${{ inputs.namespace }}" \
          #   --timeout=5m

          echo "Deployment verification completed."


  # ==========================================================
  # 4. Complete
  # ==========================================================
  complete:
    name: Complete
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Deployment completed
        run: |
          echo "=========================================="
          echo "       DEPLOYMENT COMPLETED"
          echo "=========================================="
          echo "Service          : ${{ env.SERVICE_NAME }}"
          echo "Cluster          : ${{ inputs.cluster }}"
          echo "Namespace        : ${{ inputs.namespace }}"
          echo "Service Version  : ${{ inputs.service-version }}"
          echo "Status           : SUCCESS"
          echo "=========================================="
